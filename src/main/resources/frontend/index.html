<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Digital House Management</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<script src="app.js"></script>
<!-- Chart.js library (for simple graphs) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<body class="container py-4">

<h2 class="mb-4">Digital House Management</h2>

<!-- ================= CREATE CUSTOMER ================= -->
<!--bootstrap card component-->
<div class="card p-3 mb-4"> <!--p = padding; mb = margin btm-->
	<h5>Create Customer</h5>
	<div class="mb-2">
		<input id="firstName" class="form-control" placeholder="First name">
	</div>
	<div class="mb-2">
		<input id="lastName" class="form-control" placeholder="Last name">
	</div>
	<div class="mb-2">
		<input id="birthDate" type="date" class="form-control">
	</div>
	<div class="mb-2">
		<select id="gender" class="form-select">
			<option value="M">Male (M)</option>
			<option value="W">Female (W)</option>
			<option value="D">Diverse (D)</option>
			<option value="U">Unknown (U)</option>
		</select>
	</div>
	<button class="btn btn-success" onclick="createCustomer()">
		Save Customer
	</button>
</div>

<!-- ================= ACTION BUTTONS ================= -->
<div class="mb-3">

	<button class="btn btn-primary" onclick="loadCustomers()">
		Reload Customers
	</button>

	<button class="btn btn-outline-secondary" onclick="exportJson()">
		Export JSON
	</button>

	<button class="btn btn-outline-secondary" onclick="exportCsv()">
		Export CSV
	</button>

	<button class="btn btn-outline-secondary" onclick="exportXml()">
		Export XML
	</button>

</div>

<!-- ================= CUSTOMER LIST ================= -->
<div class="card p-3">

	<h5>Customers</h5>

	<table class="table table-striped">
		<thead>
		<tr>
			<th>First Name</th>
			<th>Last Name</th>
			<th>Birth Date</th>
			<th>Gender</th>
		</tr>
		</thead>

		<tbody id="customerTable"></tbody>
	</table>

</div>
<!-- ================= CHARTS SECTION ================= -->
<!-- Bootstrap card component -->
<!-- card = container with border + shadow -->
<!-- p-3 = padding (inner space) -->
<!-- mt-4 = margin-top (space above element) -->
<div class="card" style="width: 38%; margin-left:31%; margin-top: 40px;">

	<h5>Data Analysis (Graphs)</h5>

	<!-- Canvas element where Chart.js draws the graph -->
	<!-- Canvas = empty drawing surface for JavaScript charts -->
	<canvas id="genderChart"></canvas>

</div>
</body>
</html>
