

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpwd
      MARIADB_DATABASE: hausverwaltung
      MARIADB_USER: team
      MARIADB_PASSWORD: team_pwd
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpwd || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  db_data:
